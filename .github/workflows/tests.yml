name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . build
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: wechat-reader --help

  installer:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      WECHAT_READER_HOME: ${{ runner.temp }}/wechat reader setup
      CODEX_HOME: ${{ runner.temp }}/codex config
      WECHAT_READER_NONINTERACTIVE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare unrelated Codex setting
        shell: python
        run: |
          import os
          from pathlib import Path
          root = Path(os.environ['CODEX_HOME'])
          root.mkdir(parents=True)
          (root / 'config.toml').write_text('# keep this comment\nmodel = "keep"\n')
      - name: macOS first install and reinstall
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ./Install-macOS.command
          ./Install-macOS.command
          cd "$RUNNER_TEMP"
          "$WECHAT_READER_HOME/venv/bin/python" -m wechat_reader_setup --check
      - name: Windows first install and reinstall
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call Install-Windows.cmd
          if errorlevel 1 exit /b 1
          call Install-Windows.cmd
          if errorlevel 1 exit /b 1
          cd /d "%RUNNER_TEMP%"
          "%WECHAT_READER_HOME%\venv\Scripts\python.exe" -m wechat_reader_setup --check
      - name: Verify preserved settings and one backup
        shell: python
        run: |
          import os, tomllib
          from pathlib import Path
          root = Path(os.environ['CODEX_HOME'])
          text = (root / 'config.toml').read_text()
          assert text.startswith('# keep this comment\n')
          assert tomllib.loads(text)['model'] == 'keep'
          assert len(list(root.glob('config.toml.backup-*'))) == 1
