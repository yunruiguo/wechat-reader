<text x="138" y="461" class="h">双击对应系统的安装器</text>
<text x="138" y="503" class="mono">Mac: Install-macOS.command</text>
<text x="138" y="539" class="mono">Windows: Install-Windows.cmd</text>
<rect x="138" y="564" width="870" height="148" rx="12" fill="#edf5f0"/>
<g fill="none" stroke="#167763" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M163 589l7 7 14-16M163 625l7 7 14-16M163 661l7 7 14-16"/></g>
<text x="198" y="600" class="body ok">自动准备独立 Python 环境</text>
<text x="198" y="636" class="body ok">检查浏览器与读取工具</text>
<text x="198" y="672" class="body ok">备份并配置 Codex</text>
<rect x="48" y="766" width="1024" height="208" rx="22" fill="white"/>
<circle cx="94" cy="814" r="25" fill="#167763"/><text x="85" y="824" class="number">3</text>
