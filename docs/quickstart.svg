<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1050" viewBox="0 0 1120 1050" role="img" aria-labelledby="title desc">
<title id="title">wechat-reader 三步安装</title><desc id="desc">下载并解压安装包，双击对应系统的安装器，重新打开 Codex 后粘贴微信文章链接。安装器自动准备 Python、检查浏览器和备份配置。</desc>
<defs><style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif;fill:#173a47}.title{font-size:42px;font-weight:700}.h{font-size:29px;font-weight:650}.body{font-size:23px}.small{font-size:20px;fill:#47636d}.mono{font-family:Menlo,Consolas,monospace;font-size:21px}.number{font-size:28px;font-weight:700;fill:white}.ok{fill:#167763}</style></defs>
<rect width="1120" height="1050" fill="#f0f6f5"/>
<text x="56" y="76" class="title">微信文章，交给 Codex 读</text>
<text x="56" y="116" class="body">wechat-reader · macOS / Windows · 无需先装 Python 或 Git</text>
<rect x="48" y="153" width="1024" height="230" rx="22" fill="white"/>
